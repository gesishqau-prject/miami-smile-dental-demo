<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miami Smile Dental — AI Receptionist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ocean-900:#0B3D3A;
    --ocean-700:#0E5C56;
    --ocean-500:#177F76;
    --sand-50:#FBF9F4;
    --sand-100:#F3EEE2;
    --coral-500:#FF6A55;
    --coral-600:#E85641;
    --ink-900:#152423;
    --ink-600:#4B5B59;
    --line:#E2E1D6;
    --white:#FFFFFF;
    --danger:#C0392B;
    --danger-bg:#FDEDEA;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-soft: 0 20px 45px -20px rgba(11,61,58,0.28);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(1100px 620px at 12% -8%, #E9F3EF 0%, transparent 60%),
      radial-gradient(900px 560px at 108% 8%, #FDEDE7 0%, transparent 55%),
      var(--sand-50);
    color:var(--ink-900);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding:32px 16px;
  }

  .app{
    width:100%;
    max-width:480px;
    background:var(--white);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-soft);
    display:flex;
    flex-direction:column;
    height:min(760px, 88vh);
    overflow:hidden;
    border:1px solid var(--line);
  }

  /* Header */
  .header{
    background:linear-gradient(155deg, var(--ocean-900) 0%, var(--ocean-700) 62%, var(--ocean-500) 100%);
    color:var(--sand-50);
    padding:20px 22px 18px;
    position:relative;
    flex-shrink:0;
  }
  .header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px; height:18px;
    background:var(--white);
    border-radius:18px 18px 0 0;
  }
  .brand-row{display:flex; align-items:center; gap:12px;}
  .logo{
    width:42px;height:42px;border-radius:12px;
    background:rgba(255,255,255,0.14);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,0.22);
  }
  .logo svg{width:22px;height:22px;}
  .brand-text h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:19px;
    margin:0;
    letter-spacing:0.2px;
  }
  .status-row{
    display:flex; align-items:center; gap:6px;
    margin-top:3px;
    font-size:12.5px;
    color:#CFE8E1;
  }
  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:#4ADE80;
    box-shadow:0 0 0 3px rgba(74,222,128,0.22);
  }
  .status-dot.offline{
    background:#9CA9A6;
    box-shadow:0 0 0 3px rgba(156,169,166,0.22);
  }
  .clinic-line{
    margin-top:14px;
    font-size:12.5px;
    color:#BFDCD4;
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }

  /* Chat area */
  .chat{
    flex:1;
    overflow-y:auto;
    padding:20px 16px 8px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:var(--white);
  }
  .chat::-webkit-scrollbar{width:6px;}
  .chat::-webkit-scrollbar-thumb{background:#E2E1D6;border-radius:6px;}

  .row{display:flex; gap:8px; max-width:100%;}
  .row.bot{justify-content:flex-start;}
  .row.user{justify-content:flex-end;}

  .avatar{
    width:26px;height:26px;border-radius:50%;
    background:var(--ocean-700);
    color:#fff;
    font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    margin-top:2px;
    font-family:'Fraunces',serif;
  }

  .bubble{
    padding:10px 13px;
    border-radius:var(--radius-md);
    font-size:14.5px;
    line-height:1.48;
    max-width:78%;
    white-space:pre-wrap;
  }
  .row.bot .bubble{
    background:var(--sand-100);
    color:var(--ink-900);
    border-bottom-left-radius:4px;
  }
  .row.user .bubble{
    background:var(--ocean-700);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .row.bot .bubble.alert{
    background:var(--danger-bg);
    color:var(--danger);
    border:1px solid #F3C8C0;
  }
  .row.bot .bubble.summary{
    background:var(--white);
    border:1.5px solid var(--ocean-500);
  }
  .summary strong{color:var(--ocean-700);}
  .summary-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:15px;
    color:var(--ocean-700);
    display:block;
    margin-bottom:6px;
  }

  .typing{
    display:flex; gap:4px; align-items:center;
    padding:12px 13px;
    background:var(--sand-100);
    border-radius:var(--radius-md);
    border-bottom-left-radius:4px;
    width:fit-content;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:#9CA9A6;
    animation:blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.2s;}
  .typing span:nth-child(3){animation-delay:0.4s;}
  @keyframes blink{0%,80%,100%{opacity:0.25;} 40%{opacity:1;}}

  /* Quick actions */
  .quick-actions{
    padding:10px 16px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    border-top:1px solid var(--line);
    background:var(--sand-50);
    flex-shrink:0;
    transition:opacity 0.15s;
  }
  .quick-actions.hidden{
    display:none;
  }
  .chip{
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ocean-700);
    font-size:12.5px;
    font-weight:600;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s, transform 0.1s;
    font-family:'Inter',sans-serif;
  }
  .chip:hover{background:#EFF6F4; border-color:var(--ocean-500);}
  .chip:active{transform:scale(0.97);}
  .chip.emergency{
    color:var(--danger);
    border-color:#F3C8C0;
  }
  .chip.emergency:hover{background:var(--danger-bg);}

  /* Input */
  .input-bar{
    display:flex;
    gap:8px;
    padding:12px 14px;
    border-top:1px solid var(--line);
    background:var(--white);
    flex-shrink:0;
  }
  .input-bar input{
    flex:1;
    border:1px solid var(--line);
    background:var(--sand-50);
    border-radius:999px;
    padding:11px 16px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    color:var(--ink-900);
    outline:none;
    min-width:0;
  }
  .input-bar input:focus{border-color:var(--ocean-500); background:var(--white);}
  .input-bar input:disabled{opacity:0.6;}
  .send-btn{
    width:42px;height:42px;
    border-radius:50%;
    border:none;
    background:var(--coral-500);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background 0.15s, transform 0.1s;
  }
  .send-btn:hover{background:var(--coral-600);}
  .send-btn:active{transform:scale(0.94);}
  .send-btn:disabled{opacity:0.5; cursor:not-allowed;}
  .send-btn svg{width:18px;height:18px;}

  .disclaimer{
    text-align:center;
    font-size:10.5px;
    color:var(--ink-600);
    padding:7px 16px 10px;
    background:var(--sand-50);
    flex-shrink:0;
  }

  @media (prefers-reduced-motion: reduce){
    .typing span{animation:none; opacity:0.6;}
  }

  @media (max-width:420px){
    body{padding:0;}
    .app{
      height:100vh;
      height:100dvh;
      max-width:100%;
      border-radius:0;
      border:none;
    }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="brand-row">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3C9.5 3 7.8 4.6 6.6 4.6c-1.6 0-2.6 1.4-2.6 3.4 0 3.6 1.4 8.3 2.6 10.6.6 1.1 1.2 2.1 2.1 2.1.9 0 1.1-1.6 1.4-3 .2-1 .4-1.9 1-1.9s.8.9 1 1.9c.3 1.4.5 3 1.4 3 .9 0 1.5-1 2.1-2.1 1.2-2.3 2.6-7 2.6-10.6 0-2-1-3.4-2.6-3.4C16.2 4.6 14.5 3 12 3Z" stroke="#FBF9F4" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Miami Smile Dental</h1>
        <div class="status-row"><span class="status-dot" id="statusDot"></span> <span id="statusText">AI Receptionist — Available 24/7</span></div>
      </div>
    </div>
    <div class="clinic-line">
      <span>📍 Biscayne Blvd, Miami</span>
      <span>☎ (305) 555-0142</span>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="quick-actions" id="quickActions">
    <button class="chip" data-action="book">Book Appointment</button>
    <button class="chip" data-action="whitening">Teeth Whitening</button>
    <button class="chip" data-action="invisalign">Invisalign</button>
    <button class="chip" data-action="pricing">Pricing</button>
    <button class="chip" data-action="insurance">Insurance</button>
    <button class="chip emergency" data-action="emergency">Emergency</button>
  </div>

  <div class="input-bar">
    <input id="textInput" type="text" placeholder="Type a message…" autocomplete="off" />
    <button class="send-btn" id="sendBtn" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="disclaimer">Demo only — fictional clinic. Please don't enter real personal information.</div>
</div>

<script>
(function(){
  // =========================================================================
  // Step 6: this frontend now talks to a MOCK backend at /api/chat instead of
  // deciding replies with local JavaScript logic. The visual design and the
  // deterministic lead-capture SEQUENCE (name -> contact -> service -> date ->
  // time) are unchanged from Step 3 — only how replies are generated has moved
  // to the server.
  // =========================================================================

  const chat = document.getElementById('chat');
  const input = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const quickActions = document.getElementById('quickActions');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  const API_URL = '/api/chat';
  const REQUEST_TIMEOUT_MS = 10000; // give the mock server 10s before giving up

  // ---------- Session + conversation state (sent to the backend each turn) ----------
  const sessionId = createSessionId();
  let conversationHistory = []; // [{role:'user'|'assistant', content:string}, ...]

  // Remembers the last service the backend mentioned (e.g. "Teeth Whitening")
  // even on turns where booking wasn't started yet, so that when the user
  // later says "yes" to booking, we can still prefill the service field.
  let lastSuggestedService = null;

  // leadState is the single source of truth for lead capture, owned by THIS
  // frontend code (deterministic), not by the AI/backend.
  const leadState = {
    step: null,           // which field we're currently asking for (or null)
    collected: {
      name: null,
      contact: null,
      service: null,
      date: null,
      time: null,
    },
    captureActive: false,
  };

  const FIELD_ORDER = ['name', 'contact', 'service', 'date', 'time'];

  function firstMissingField(collected){
    return FIELD_ORDER.find(f => !collected[f]) || null;
  }

  // A small, high-severity keyword list checked LOCALLY, instantly, before
  // any network call — so a true emergency message is never delayed or lost
  // if the backend is slow or unreachable.
  const CRITICAL_LOCAL_KEYWORDS = /\b(can.?t breathe|cant breathe|won.?t stop bleeding|wont stop bleeding|knocked out|severe swelling|chest pain|passed out|unconscious)\b/i;

  function createSessionId(){
    if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
    return 'session-' + Math.random().toString(36).slice(2) + Date.now();
  }

  // ---------- Rendering helpers ----------
  function scrollToBottom(){ chat.scrollTop = chat.scrollHeight; }

  function addBotMessage(text, opts){
    opts = opts || {};
    const row = document.createElement('div');
    row.className = 'row bot';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'MS';
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (opts.alert ? ' alert' : '') + (opts.summary ? ' summary' : '');
    if(opts.summary && opts.title){
      const title = document.createElement('span');
      title.className = 'summary-title';
      title.textContent = opts.title;
      bubble.appendChild(title);
      const rest = document.createElement('span');
      rest.textContent = text;
      bubble.appendChild(rest);
    } else {
      bubble.textContent = text;
    }
    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollToBottom();
  }

  function addUserMessage(text){
    const row = document.createElement('div');
    row.className = 'row user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollToBottom();
  }

  let typingRow = null;
  function showTyping(){
    typingRow = document.createElement('div');
    typingRow.className = 'row bot';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'MS';
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerHTML = '<span></span><span></span><span></span>';
    typingRow.appendChild(avatar);
    typingRow.appendChild(typing);
    chat.appendChild(typingRow);
    scrollToBottom();
  }
  function hideTyping(){
    if(typingRow){ typingRow.remove(); typingRow = null; }
  }

  function setInputEnabled(enabled){
    input.disabled = !enabled;
    sendBtn.disabled = !enabled;
  }

  function setConnectionStatus(online){
    if(online){
      statusDot.classList.remove('offline');
      statusText.textContent = 'AI Receptionist — Available 24/7';
    } else {
      statusDot.classList.add('offline');
      statusText.textContent = 'Connection issue — please try again';
    }
  }

  function setQuickActionsVisible(visible){
    quickActions.classList.toggle('hidden', !visible);
  }

  // ---------- Backend communication ----------
  async function callBackend(message){
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

    try{
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId: sessionId,
          message: message,
          conversationHistory: conversationHistory.slice(-16), // keep payload small
          leadState: leadState,
        }),
        signal: controller.signal,
      });
      clearTimeout(timeoutId);

      if(!response.ok){
        throw new Error('Backend responded with status ' + response.status);
      }
      return await response.json();
    } catch(err){
      clearTimeout(timeoutId);
      throw err;
    }
  }

  // ---------- Lead capture (deterministic, frontend-owned) ----------
  function beginCaptureFromSuggestion(suggestedService){
    leadState.captureActive = true;
    if(suggestedService && !leadState.collected.service){
      leadState.collected.service = suggestedService;
    }
    leadState.step = firstMissingField(leadState.collected);
    setQuickActionsVisible(false);
  }

  // Called with the user's raw message when we are mid-capture: writes the
  // answer into the field that was being asked for, then advances the step.
  function demoSlotsForDate(dateString){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dateString || '')) return [];
    const d = new Date(dateString + 'T12:00:00');
    if(Number.isNaN(d.getTime())) return [];
    const day = d.getDay();
    if(day === 0) return [];
    if(day === 6) return ['9:00 AM','10:30 AM','12:00 PM'];
    if(day === 5) return ['8:30 AM','10:00 AM','1:30 PM','3:00 PM'];
    return ['8:30 AM','10:00 AM','1:30 PM','3:30 PM','5:00 PM'];
  }

  function normalizeTime(value){
    return String(value || '').trim().toUpperCase().replace(/\s+/g,' ');
  }

  function validateCaptureAnswer(field, rawMessage){
    const value = rawMessage.trim();
    if(!value) return {ok:false, message:'Please enter a value so I can continue.'};

    if(field === 'date'){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(value)){
        return {ok:false, message:'Please enter the date as YYYY-MM-DD — for example, 2026-09-24.'};
      }
      const chosen = new Date(value + 'T12:00:00');
      const today = new Date(); today.setHours(0,0,0,0);
      if(Number.isNaN(chosen.getTime()) || chosen < today){
        return {ok:false, message:'Please choose a valid future date.'};
      }
      if(chosen.getDay() === 0){
        return {ok:false, message:'The clinic is closed on Sundays. Please choose Monday through Saturday.'};
      }
    }

    if(field === 'time'){
      const slots = demoSlotsForDate(leadState.collected.date);
      const match = slots.find(slot => normalizeTime(slot) === normalizeTime(value));
      if(!match){
        return {ok:false, message:`That time isn't available in the demo schedule. Please choose one of: ${slots.join(', ')}.`};
      }
      return {ok:true, value:match};
    }
    return {ok:true, value:value};
  }

  function recordCaptureAnswer(rawMessage){
    if(!leadState.step) return {ok:true};
    const field = leadState.step;
    const validation = validateCaptureAnswer(field, rawMessage);
    if(!validation.ok) return validation;
    leadState.collected[field] = validation.value;
    leadState.step = firstMissingField(leadState.collected);
    return {ok:true};
  }

  function endCaptureIfComplete(){
    if(leadState.captureActive && leadState.step === null){
      leadState.captureActive = false;
      setQuickActionsVisible(true);
      // Reset collected service/date/time so a new request can be captured
      // later in the same session, while keeping name/contact on hand.
      leadState.collected.service = null;
      leadState.collected.date = null;
      leadState.collected.time = null;
    }
  }

  // ---------- Main send pipeline ----------
  async function sendMessage(rawText){
    const text = rawText.trim();
    if(!text) return;

    addUserMessage(text);
    conversationHistory.push({ role: 'user', content: text });
    input.value = '';

    // 1) Instant local emergency fallback — never waits on the network.
    if(CRITICAL_LOCAL_KEYWORDS.test(text)){
      addBotMessage(
        "If this is a life-threatening emergency, please call 911 or go to the nearest ER right away.",
        { alert: true }
      );
    }

    // 2) Deterministic lead-capture bookkeeping happens BEFORE calling the backend,
    //    so structured code (not the AI) decides what was just answered.
    const wasCaptureActive = leadState.captureActive;
    if(wasCaptureActive){
      const captureResult = recordCaptureAnswer(text);
      if(!captureResult.ok){
        addBotMessage(captureResult.message);
        conversationHistory.push({ role:'assistant', content:captureResult.message });
        input.focus();
        return;
      }
    }

    setInputEnabled(false);
    showTyping();

    try{
      const result = await callBackend(text);
      hideTyping();
      setConnectionStatus(true);

      // Render the backend's reply
      if(result.intent === 'lead_capture_complete'){
        addBotMessage(result.reply, { summary: true, title: "Here's what I've got 👇" });
      } else {
        addBotMessage(result.reply, { alert: !!result.isPossibleEmergency });
      }
      conversationHistory.push({ role: 'assistant', content: result.reply });

      // React to leadCapture flags from the backend
      if(result.leadCapture){
        if(result.leadCapture.suggestedService){
          lastSuggestedService = result.leadCapture.suggestedService;
        }
        if(result.leadCapture.shouldStart && !leadState.captureActive){
          beginCaptureFromSuggestion(lastSuggestedService);
          lastSuggestedService = null; // consumed
        }
      }

      // If we were mid-capture, check whether this turn completed it
      if(wasCaptureActive){
        endCaptureIfComplete();
      }

    } catch(err){
      hideTyping();
      setConnectionStatus(false);
      addBotMessage(
        "I'm having trouble connecting to the receptionist system right now. Please call us directly at (305) 555-0142, or try again in a moment.",
        { alert: true }
      );
      // Roll back capture bookkeeping for this turn isn't necessary — the
      // user's answer is still safely recorded locally in leadState; they
      // can simply try sending again once the connection is back.
    } finally {
      setInputEnabled(true);
      input.focus();
    }
  }

  // ---------- Quick action buttons ----------
  quickActions.addEventListener('click', (e)=>{
    const btn = e.target.closest('.chip');
    if(!btn) return;
    const action = btn.dataset.action;
    const labels = {
      book: "I'd like to book an appointment",
      whitening: "Tell me about teeth whitening",
      invisalign: "Tell me about Invisalign",
      pricing: "What are your prices?",
      insurance: "Do you accept my insurance?",
      emergency: "I'm having a dental emergency"
    };
    if(labels[action]) sendMessage(labels[action]);
  });

  // ---------- Input events ----------
  sendBtn.addEventListener('click', ()=> sendMessage(input.value));
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !input.disabled) sendMessage(input.value);
  });

  // ---------- Welcome message ----------
  window.addEventListener('load', ()=>{
    setTimeout(()=>{
      const welcome = "Hi, welcome to Miami Smile Dental! 😊 I'm your AI receptionist, here 24/7 to answer questions, share pricing, or help you book an appointment. How can I help you today?";
      addBotMessage(welcome);
      conversationHistory.push({ role: 'assistant', content: welcome });
    }, 400);
  });
})();
</script>
</body>
</html>
